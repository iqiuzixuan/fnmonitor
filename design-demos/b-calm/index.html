<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>飞牛监控 · 静 Calm</title>
<script src="../shared/style-switch.js"></script>
<script>
  /* 尽早应用主题，避免首屏闪烁 */
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('fnm.b.settings') || '{}');
      var mode = s.theme || 'light';
      if (mode === 'auto') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = mode;
      document.documentElement.dataset.accent = s.accent || 'ink';
    } catch (e) {}
  })();
</script>
<style>
/* =====================================================================
   1. DESIGN TOKENS
   ---------------------------------------------------------------------
   - 所有颜色、阴影、圆角、字号、间距、动效都是 token
   - 主题 = 一组 surface/ink token；强调色 = data-accent 覆盖 --accent
   - 图表色、状态色与强调色彼此独立：换强调色不会改变数据含义
   ===================================================================== */
:root {
  /* type */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", system-ui, sans-serif;
  --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", system-ui, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Cascadia Code", ui-monospace, Menlo, Consolas, monospace;

  --fs-hero: 60px;     /* 指标大数字 */
  --fs-display: 38px;  /* 首屏结论句 */
  --fs-h2: 26px;       /* 版块标题 */
  --fs-h3: 17px;
  --fs-body: 15px;
  --fs-sm: 13px;
  --fs-xs: 12px;
  --lh-tight: 1.15;
  --lh-body: 1.65;

  /* space (4pt rhythm) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
  --s7: 32px; --s8: 40px; --s9: 56px; --s10: 80px;
  --section-gap: 88px;
  --page-w: 1280px;
  --page-pad: 32px;

  /* radius */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 22px; --r-pill: 999px;

  /* motion */
  --ease: cubic-bezier(.22, .8, .24, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --dur-1: 140ms; --dur-2: 260ms; --dur-3: 480ms; --dur-gauge: 900ms;
}

/* ---- Light (primary) ---- */
:root, [data-theme="light"] {
  color-scheme: light;
  --bg: #F6F5F1;
  --bg-bar: rgba(246, 245, 241, .82);
  --card: #FFFFFF;
  --card-sunk: #FAF9F6;
  --card-hover: #FFFFFF;
  --fill-1: rgba(28, 26, 22, .045);
  --fill-2: rgba(28, 26, 22, .08);
  --fill-3: rgba(28, 26, 22, .14);
  --line: rgba(28, 26, 22, .07);
  --line-strong: rgba(28, 26, 22, .12);
  --ink-1: #1C1C1E;
  --ink-2: #6E6E73;
  --ink-3: #A1A1A6;
  --ink-inv: #FFFFFF;
  --scrim: rgba(28, 24, 18, .22);

  --ok: #2F8F5B;     --ok-soft: rgba(47, 143, 91, .11);
  --warn: #B86E0A;   --warn-soft: rgba(214, 140, 20, .13);
  --crit: #CC3B32;   --crit-soft: rgba(204, 59, 50, .10);
  --sleep: #5D6C9C;  --sleep-soft: rgba(93, 108, 156, .10);

  /* 数据序列色（已通过色盲分离度校验，light surface） */
  --c1: #3368D6; --c2: #E2763F; --c3: #1E9E8A; --c4: #8A6FDC;
  --gauge: var(--ink-1);
  --spark: #8E8E93;

  --shadow-card: 0 0 0 1px rgba(28, 25, 20, .04), 0 1px 2px rgba(28, 25, 20, .04), 0 8px 24px -12px rgba(28, 25, 20, .10);
  --shadow-raise: 0 0 0 1px rgba(28, 25, 20, .05), 0 2px 4px rgba(28, 25, 20, .04), 0 18px 40px -16px rgba(28, 25, 20, .18);
  --shadow-pop: 0 0 0 1px rgba(28, 25, 20, .06), 0 24px 64px -12px rgba(28, 25, 20, .28);
  --shadow-thumb: 0 1px 2px rgba(0, 0, 0, .08), 0 2px 6px rgba(0, 0, 0, .06);
}

/* ---- Warm dark ---- */
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #161514;
  --bg-bar: rgba(22, 21, 20, .82);
  --card: #1F1E1C;
  --card-sunk: #1A1918;
  --card-hover: #23221F;
  --fill-1: rgba(255, 248, 235, .055);
  --fill-2: rgba(255, 248, 235, .09);
  --fill-3: rgba(255, 248, 235, .16);
  --line: rgba(255, 248, 235, .07);
  --line-strong: rgba(255, 248, 235, .12);
  --ink-1: #F2EFE9;
  --ink-2: #A39F97;
  --ink-3: #6F6B64;
  --ink-inv: #161514;
  --scrim: rgba(0, 0, 0, .5);

  --ok: #5DBB85;     --ok-soft: rgba(93, 187, 133, .13);
  --warn: #E2A646;   --warn-soft: rgba(226, 166, 70, .14);
  --crit: #EE6A5F;   --crit-soft: rgba(238, 106, 95, .14);
  --sleep: #8E9BCB;  --sleep-soft: rgba(142, 155, 203, .12);

  --c1: #5585E8; --c2: #D8743C; --c3: #1F9C86; --c4: #8B74E0;
  --spark: #7C7871;

  --shadow-card: 0 0 0 1px rgba(255, 248, 235, .045), 0 1px 0 rgba(255, 248, 235, .03) inset, 0 10px 30px -14px rgba(0, 0, 0, .6);
  --shadow-raise: 0 0 0 1px rgba(255, 248, 235, .07), 0 20px 44px -16px rgba(0, 0, 0, .7);
  --shadow-pop: 0 0 0 1px rgba(255, 248, 235, .08), 0 28px 70px -14px rgba(0, 0, 0, .75);
  --shadow-thumb: 0 1px 2px rgba(0, 0, 0, .4);
}

/* ---- Accent palette (7 套，对应原应用 7 个配色主题) ---- */
[data-accent="ink"]      { --accent: #2B50C0; }
[data-accent="indigo"]   { --accent: #5146C2; }
[data-accent="teal"]     { --accent: #137473; }
[data-accent="moss"]     { --accent: #3F7A3A; }
[data-accent="amber"]    { --accent: #A8620A; }
[data-accent="rose"]     { --accent: #B23A5B; }
[data-accent="graphite"] { --accent: #3A3A3C; }
[data-theme="dark"][data-accent="ink"]      { --accent: #7896F4; }
[data-theme="dark"][data-accent="indigo"]   { --accent: #958CF2; }
[data-theme="dark"][data-accent="teal"]     { --accent: #4DB6B0; }
[data-theme="dark"][data-accent="moss"]     { --accent: #82BC77; }
[data-theme="dark"][data-accent="amber"]    { --accent: #E3A447; }
[data-theme="dark"][data-accent="rose"]     { --accent: #E77C97; }
[data-theme="dark"][data-accent="graphite"] { --accent: #D9D5CE; }
:root {
  --accent-soft: color-mix(in srgb, var(--accent) 11%, transparent);
  --accent-ring: color-mix(in srgb, var(--accent) 38%, transparent);
}

/* =====================================================================
   2. BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink-1);
  font: 400 var(--fs-body)/var(--lh-body) var(--font-sans);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "tnum" 0;
  transition: background-color var(--dur-3) var(--ease), color var(--dur-3) var(--ease);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--accent-soft); }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.i-sm { width: 15px; height: 15px; }
.i-lg { width: 22px; height: 22px; }
.num, .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.num { font-family: var(--font-display); letter-spacing: -.035em; font-weight: 600; line-height: 1; }
.mono { font-family: var(--font-mono); font-size: .92em; letter-spacing: 0; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hidden { display: none !important; }

/* =====================================================================
   3. TOP BAR
   ===================================================================== */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--bg-bar);
  -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  border-bottom: 1px solid transparent; transition: border-color var(--dur-2) var(--ease);
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-in {
  max-width: var(--page-w); margin: 0 auto; height: 64px; padding: 0 var(--page-pad);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s4);
}
.brand { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink-1); color: var(--ink-inv); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 18px; height: 18px; stroke-width: 2; }
.brand-name { font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.host-chip { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 10px; border-radius: var(--r-pill); background: var(--fill-1); color: var(--ink-2); font-size: var(--fs-sm); white-space: nowrap; }
.live { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--ok); opacity: 0; }
.live.beat::after { animation: beat 1.6s var(--ease) 1; }
.live.paused { background: var(--ink-3); }
@keyframes beat { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(3.2); opacity: 0; } }
.tools { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.clock-mini { font-size: var(--fs-sm); color: var(--ink-2); margin-right: 8px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); transition: background var(--dur-1), color var(--dur-1); position: relative; }
.icon-btn:hover { background: var(--fill-1); color: var(--ink-1); }
.icon-btn[aria-pressed="true"] { background: var(--ink-1); color: var(--ink-inv); }
.kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; font: 500 11px/1 var(--font-mono); color: var(--ink-2); background: var(--fill-1); box-shadow: inset 0 -1px 0 var(--line-strong); }

/* ---- Segmented control (通用) ---- */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: var(--r-pill); background: var(--fill-1); isolation: isolate; }
.seg button { position: relative; z-index: 1; height: 30px; padding: 0 16px; border-radius: var(--r-pill); font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; transition: color var(--dur-2) var(--ease); }
.seg button:hover { color: var(--ink-1); }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { color: var(--ink-1); }
.seg .thumb { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; border-radius: var(--r-pill); background: var(--card); box-shadow: var(--shadow-thumb); transition: transform var(--dur-3) var(--ease), width var(--dur-3) var(--ease); }
[data-theme="dark"] .seg .thumb { background: #3A3835; }
.seg.sm button { height: 26px; padding: 0 11px; font-size: 13px; }
.seg.nav button { padding: 0 20px; }

/* =====================================================================
   4. PAGE + SECTION SCAFFOLD
   ===================================================================== */
.page { max-width: var(--page-w); margin: 0 auto; padding: var(--s8) var(--page-pad) 140px; }
.page[hidden] { display: none; }
.page-enter { animation: pageIn var(--dur-3) var(--ease); }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-card); position: relative; min-width: 0; }
.card.pad { padding: var(--s6); }
.tap { cursor: pointer; transition: box-shadow var(--dur-2) var(--ease), transform var(--dur-2) var(--ease), background var(--dur-2); }
.tap:hover { box-shadow: var(--shadow-raise); transform: translateY(-1px); }
.tap:active { transform: translateY(0) scale(.995); }
.tap .more { opacity: 0; transition: opacity var(--dur-2), transform var(--dur-2) var(--ease); transform: translateX(-3px); color: var(--ink-3); }
.tap:hover .more, .tap:focus-visible .more { opacity: 1; transform: none; }

.module { margin-top: var(--section-gap); position: relative; }
.mod-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s6); margin-bottom: var(--s6); }
.mod-head-l { min-width: 0; }
.mod-kicker { display: flex; align-items: center; gap: 10px; font: 500 12px/1 var(--font-mono); color: var(--ink-3); letter-spacing: .04em; margin-bottom: 10px; }
.mod-kicker::after { content: ""; width: 28px; height: 1px; background: var(--line-strong); }
.mod-title { margin: 0; font-size: var(--fs-h2); line-height: 1.2; font-weight: 650; letter-spacing: -.02em; }
.mod-dek { margin: 8px 0 0; color: var(--ink-2); max-width: 64ch; font-size: var(--fs-body); }
.mod-dek b { color: var(--ink-1); font-weight: 600; }
.mod-dek .warn { color: var(--warn); font-weight: 600; }
.mod-actions { display: flex; align-items: center; gap: var(--s3); flex: none; }
.link-btn { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: var(--r-pill); color: var(--ink-2); font-size: var(--fs-sm); font-weight: 500; transition: background var(--dur-1), color var(--dur-1); }
.link-btn:hover { background: var(--fill-1); color: var(--ink-1); }
.mod-editbar { display: none; }
.mod-headless .mod-head { display: none; }

.grid { display: grid; gap: var(--s4); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.label { font-size: var(--fs-sm); color: var(--ink-2); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.label .i { color: var(--ink-3); }
.eyebrow { font-size: var(--fs-xs); color: var(--ink-3); letter-spacing: .02em; }
.unit { font-family: var(--font-sans); font-size: .34em; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-left: .18em; }
.sub { font-size: var(--fs-sm); color: var(--ink-2); }
.hair { height: 1px; background: var(--line); border: 0; margin: var(--s5) 0; }

/* ---- pills ---- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 550; white-space: nowrap; background: var(--fill-1); color: var(--ink-2); }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill .i { width: 13px; height: 13px; stroke-width: 2; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.sleep { background: var(--sleep-soft); color: var(--sleep); }
.pill.btn { cursor: pointer; transition: filter var(--dur-1); }
.pill.btn:hover { filter: brightness(.96); }
.st-ok { color: var(--ok); } .st-warn { color: var(--warn); } .st-crit { color: var(--crit); }

/* ---- bars ---- */
.bar { height: 6px; border-radius: 3px; background: var(--fill-2); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--ink-1); transition: width var(--dur-gauge) var(--ease), background var(--dur-2); }
.bar.thin { height: 4px; }
.bar > i.warn { background: var(--warn); } .bar > i.crit { background: var(--crit); } .bar > i.ok { background: var(--ok); }
.stack { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; }
.stack > i { display: block; height: 100%; min-width: 2px; transition: flex-grow var(--dur-gauge) var(--ease); }
.stack > i:first-child { border-radius: 5px 0 0 5px; } .stack > i:last-child { border-radius: 0 5px 5px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: var(--s3); font-size: var(--fs-sm); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.legend b { color: var(--ink-1); font-weight: 600; font-variant-numeric: tabular-nums; }

/* =====================================================================
   5. HERO
   ===================================================================== */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr) 340px; gap: var(--s8); align-items: center; padding: var(--s5) 0 var(--s4); }
.ring-wrap { position: relative; width: 148px; height: 148px; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { stroke: var(--fill-2); }
.ring-val { stroke: var(--ok); transition: stroke-dashoffset 1.4s var(--ease), stroke var(--dur-3); }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-center .num { font-size: 46px; }
.ring-center .eyebrow { margin-top: 6px; }
.greet { color: var(--ink-2); font-size: var(--fs-body); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.verdict { margin: 0; font-size: var(--fs-display); line-height: 1.22; font-weight: 650; letter-spacing: -.028em; text-wrap: balance; }
.verdict .soft { display: block; margin-top: 10px; color: var(--ink-2); font-weight: 550; font-size: .62em; line-height: 1.45; letter-spacing: -.012em; }
.issues { display: flex; flex-wrap: wrap; gap: 8px; margin-top: var(--s5); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: var(--s5); color: var(--ink-2); font-size: var(--fs-sm); }
.facts span { display: inline-flex; align-items: center; gap: 7px; }
.facts .i { color: var(--ink-3); width: 15px; height: 15px; }
.clock-card { padding: var(--s6); }
.clock-time { font-size: 54px; }
.clock-time .sec { font-size: .36em; color: var(--ink-3); margin-left: 6px; letter-spacing: 0; font-weight: 500; }
.clock-date { margin-top: 10px; font-weight: 550; }
.clock-lunar { color: var(--ink-2); font-size: var(--fs-sm); margin-top: 2px; }
.wx { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; margin-top: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--line); }
.wx-ico { grid-row: span 2; width: 44px; height: 44px; color: var(--ink-2); }
.wx-ico svg { width: 44px; height: 44px; stroke-width: 1.3; }
.wx-main { display: flex; align-items: baseline; gap: 10px; }
.wx-main .num { font-size: 28px; }
.wx-sub { font-size: var(--fs-xs); color: var(--ink-2); }

/* =====================================================================
   6. METRIC CARDS
   ===================================================================== */
.metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric { padding: var(--s6) var(--s6) var(--s5); display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto; gap: 0 var(--s4); min-height: 236px; }
.metric .m-top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s4); }
.metric .m-state { font-size: var(--fs-xs); font-weight: 550; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; }
.metric .m-val { font-size: var(--fs-hero); align-self: end; white-space: nowrap; }
.metric .m-val .unit { font-size: 20px; }
.metric .m-sub { font-size: var(--fs-sm); color: var(--ink-2); margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric .m-gauge { grid-row: 2; grid-column: 2; align-self: center; width: 92px; height: 92px; }
.metric .m-foot { grid-column: 1 / -1; margin-top: var(--s4); height: 44px; }
.metric.is-warn .m-state { color: var(--warn); } .metric.is-crit .m-state { color: var(--crit); }
.gauge-track { stroke: var(--fill-2); }
.gauge-val { stroke: var(--gauge); transition: stroke-dashoffset var(--dur-gauge) var(--ease), stroke var(--dur-2); }
.gauge-val.warn { stroke: var(--warn); } .gauge-val.crit { stroke: var(--crit); }
.gauge-tick { stroke: var(--card); stroke-width: 2; }
.net-vals { align-self: end; display: grid; gap: 10px; }
.net-vals .row { display: flex; align-items: baseline; gap: 10px; }
.net-vals .num { font-size: 40px; }
.net-vals .row.sec .num { font-size: 26px; color: var(--ink-2); }
.net-vals .arr { width: 18px; height: 18px; flex: none; align-self: center; }
.drive-pips { display: flex; gap: 6px; align-items: flex-end; height: 44px; }
.drive-pips > div { flex: 1; display: grid; gap: 6px; }
.drive-pips .pip { height: 22px; border-radius: 6px; background: var(--fill-2); position: relative; overflow: hidden; }
.drive-pips .pip > i { position: absolute; inset: auto 0 0 0; background: var(--ink-1); opacity: .85; }
.drive-pips .pip.sleep { background: repeating-linear-gradient(135deg, var(--sleep-soft) 0 4px, transparent 4px 8px); box-shadow: inset 0 0 0 1px var(--sleep-soft); }
.drive-pips .pip.sleep > i { background: var(--sleep); opacity: .45; }
.drive-pips .pip.warn > i { background: var(--warn); }
.drive-pips span { font: 500 10.5px/1 var(--font-mono); color: var(--ink-3); text-align: center; }
.spark { width: 100%; height: 100%; display: block; overflow: visible; }
.spark path.line { fill: none; stroke: var(--spark); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.spark path.area { fill: var(--fill-1); stroke: none; }
.spark circle { fill: var(--ink-1); }

/* =====================================================================
   7. STORAGE
   ===================================================================== */
.pool { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--s6); padding: var(--s5) var(--s6); margin-bottom: var(--s4); }
.pool .num { font-size: 34px; }
.pool .stack { height: 12px; }
.drives { grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); }
.drive { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); min-height: 228px; overflow: hidden; }
.drive-top { display: flex; align-items: flex-start; gap: var(--s3); }
.drive-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--fill-1); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.drive-ico .i { width: 22px; height: 22px; stroke-width: 1.5; }
.drive-name { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.drive-model { font-size: var(--fs-sm); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drive-cap { margin-top: auto; }
.drive-cap .row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.drive-cap .num { font-size: 26px; }
.drive-meta { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-xs); color: var(--ink-2); border-top: 1px solid var(--line); padding-top: var(--s3); }
.drive-meta b { display: block; font-size: var(--fs-sm); color: var(--ink-1); font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 1px; }
.drive.is-warn .drive-ico { background: var(--warn-soft); color: var(--warn); }
/* 休眠：降饱和、夜色底纹、月亮、轻微下沉 —— 一眼可辨 */
.drive.is-sleep { background: linear-gradient(180deg, color-mix(in srgb, var(--sleep) 7%, var(--card)), var(--card) 75%); box-shadow: 0 0 0 1px var(--sleep-soft), 0 1px 2px rgba(0,0,0,.02); }
.drive.is-sleep .drive-ico { background: var(--sleep-soft); color: var(--sleep); }
.drive.is-sleep .drive-cap, .drive.is-sleep .drive-meta { opacity: .55; }
.drive.is-sleep .bar > i { background: var(--sleep); }
.zzz { position: absolute; right: 18px; top: 16px; color: var(--sleep); font: 600 12px/1 var(--font-display); letter-spacing: .1em; opacity: .7; }
.zzz span { display: inline-block; animation: zz 3.6s ease-in-out infinite; }
.zzz span:nth-child(2) { animation-delay: .5s; font-size: 10px; } .zzz span:nth-child(3) { animation-delay: 1s; font-size: 8px; }
@keyframes zz { 0%, 100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-4px); opacity: 1; } }
.io-line { display: flex; gap: 14px; font-size: var(--fs-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.io-line .i { width: 12px; height: 12px; stroke-width: 2.2; vertical-align: -1px; }

/* =====================================================================
   8. GENERIC LIST / KV / TABLE
   ===================================================================== */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 0; }
.kv > div { display: contents; }
.kv dt, .kv dd { padding: 11px 0; border-top: 1px solid var(--line); margin: 0; font-size: var(--fs-sm); }
.kv dt { color: var(--ink-2); padding-right: var(--s6); white-space: nowrap; }
.kv dd { text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.kv > div:first-child dt, .kv > div:first-child dd { border-top: 0; }
.rows { display: flex; flex-direction: column; }
.row-i { display: grid; align-items: center; gap: var(--s4); padding: 12px 0; border-top: 1px solid var(--line); font-size: var(--fs-sm); }
.row-i:first-child { border-top: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.tbl th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: var(--fs-xs); padding: 0 12px 10px; white-space: nowrap; }
.tbl td { padding: 11px 12px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { padding-left: 0; } .tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.tbl .r { text-align: right; }
.tbl .cmd { color: var(--ink-3); font-family: var(--font-mono); font-size: 11.5px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
.cell-bar { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.cell-bar .bar { width: 64px; height: 4px; }

/* =====================================================================
   9. COMPUTE / THERMAL / ENERGY
   ===================================================================== */
.cores { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; align-items: end; height: 132px; margin-top: var(--s5); }
.core { display: grid; grid-template-rows: 1fr auto; gap: 8px; height: 100%; text-align: center; }
.core .col { position: relative; border-radius: 8px; background: var(--fill-1); overflow: hidden; }
.core .col > i { position: absolute; inset: auto 0 0 0; height: 0; background: var(--ink-1); border-radius: 8px 8px 0 0; transition: height var(--dur-gauge) var(--ease), background var(--dur-2); }
.core .col > i.warn { background: var(--warn); } .core .col > i.crit { background: var(--crit); }
.core span { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.core b { position: absolute; left: 0; right: 0; top: 6px; font-size: 11px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; z-index: 1; mix-blend-mode: normal; }
.big-stat { display: flex; align-items: baseline; gap: 2px; }
.big-stat .num { font-size: 40px; }
.big-stat .unit { font-size: 15px; }
.split { display: flex; gap: var(--s7); margin-top: var(--s4); flex-wrap: wrap; }
.split > div { min-width: 0; }
.split .eyebrow { display: block; margin-bottom: 2px; }
.split b { font-weight: 600; font-variant-numeric: tabular-nums; }

.thermo-row { display: grid; grid-template-columns: 112px 1fr 64px; align-items: center; gap: var(--s4); padding: 10px 0; font-size: var(--fs-sm); }
.thermo { position: relative; height: 6px; border-radius: 3px; background: var(--fill-1); }
.thermo > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink-1); transition: width var(--dur-gauge) var(--ease), background var(--dur-2); }
.thermo > i.warn { background: var(--warn); } .thermo > i.crit { background: var(--crit); } .thermo > i.sleep { background: var(--sleep); opacity: .5; }
.thermo .mk { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line-strong); }
.thermo-row .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.thermo-scale { display: grid; grid-template-columns: 112px 1fr 64px; gap: var(--s4); font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.thermo-scale > div { position: relative; height: 14px; }
.thermo-scale > div > span { position: absolute; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.fan { display: flex; align-items: center; gap: var(--s4); padding: 12px 0; }
.fan + .fan { border-top: 1px solid var(--line); }
.fan-ico { width: 40px; height: 40px; border-radius: 50%; background: var(--fill-1); display: grid; place-items: center; color: var(--ink-2); }
.fan-ico svg { width: 24px; height: 24px; animation: spin linear infinite; animation-duration: var(--spin, 2s); stroke-width: 1.5; }
@keyframes spin { to { transform: rotate(360deg); } }
.fan .num { font-size: 24px; }
.volts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.volt { padding: 12px 14px; border-radius: var(--r-md); background: var(--card-sunk); box-shadow: inset 0 0 0 1px var(--line); }
.volt .num { font-size: 20px; }
.engine { display: grid; grid-template-columns: 64px 1fr 40px; gap: 12px; align-items: center; font-size: var(--fs-sm); padding: 6px 0; }
.engine .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

.energy { display: grid; grid-template-columns: 1.1fr 1fr; gap: var(--s4); }
.energy-live .num.huge { font-size: 76px; }
.energy-live .num.huge .unit { font-size: 24px; }
.stat-cells { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-card); }
.stat-cell { background: var(--card); padding: var(--s5) var(--s6); }
.stat-cell .num { font-size: 32px; margin-top: 8px; }
.stat-cell .num .unit { font-size: 14px; }
.stat-cell .sub { margin-top: 6px; font-size: var(--fs-xs); }

/* =====================================================================
   10. CHARTS
   ===================================================================== */
.chart-card { padding: var(--s5) var(--s6) var(--s4); }
.chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s3); }
.chart-title { font-weight: 600; font-size: 15px; }
.chart-legend { display: flex; gap: var(--s5); font-size: var(--fs-xs); color: var(--ink-2); }
.chart-legend > span { display: grid; gap: 2px; justify-items: end; }
.chart-legend .lk { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend .lk i { width: 10px; height: 3px; border-radius: 2px; }
.chart-legend .lv { font: 600 17px/1.1 var(--font-display); color: var(--ink-1); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.chart-legend .lv small { font: 500 11px var(--font-sans); color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
.chart { position: relative; height: 168px; touch-action: pan-y; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis-t { fill: var(--ink-3); font-size: 10.5px; font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
.chart .ln { fill: none; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { stroke: none; }
.chart .xh { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; transition: opacity var(--dur-1); }
.chart .dot { stroke: var(--card); stroke-width: 2; opacity: 0; transition: opacity var(--dur-1); }
.chart.hovering .xh, .chart.hovering .dot { opacity: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .peak-t { fill: var(--ink-2); font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tip { position: absolute; z-index: 5; pointer-events: none; min-width: 120px; padding: 9px 12px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow-pop); font-size: var(--fs-xs); opacity: 0; transform: translateY(4px); transition: opacity var(--dur-1), transform var(--dur-1); white-space: nowrap; }
.tip.show { opacity: 1; transform: none; }
.tip .tt { color: var(--ink-3); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; line-height: 1.7; }
.tip .tr i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; }
.bars { position: relative; height: 148px; }
.bars svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.bars rect.b { transition: opacity var(--dur-1); }
.bars.hovering rect.b { opacity: .45; } .bars.hovering rect.b.on { opacity: 1; }
.rank-row { display: grid; grid-template-columns: 136px 1fr 84px; gap: var(--s4); align-items: center; padding: 9px 0; font-size: var(--fs-sm); }
.rank-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-row .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.rank-row .stack { height: 8px; }

/* =====================================================================
   11. SHEET (渐进披露的核心)
   ===================================================================== */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--dur-3) var(--ease); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 61; top: 10px; right: 10px; bottom: 10px; width: min(620px, calc(100vw - 20px)); background: var(--bg); border-radius: 26px; box-shadow: var(--shadow-pop); transform: translateX(calc(100% + 24px)); transition: transform var(--dur-3) var(--ease-sheet); display: flex; flex-direction: column; overflow: hidden; visibility: hidden; }
.sheet.on { transform: none; visibility: visible; }
.sheet:focus { outline: none; }
.sheet-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s5) var(--s5) var(--s4) var(--s6); }
.sheet-head .drive-ico { width: 44px; height: 44px; }
.sheet-title { font-size: 20px; font-weight: 650; letter-spacing: -.02em; line-height: 1.25; }
.sheet-sub { font-size: var(--fs-sm); color: var(--ink-2); }
.sheet-head .grow { flex: 1; min-width: 0; }
.sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--s6) var(--s8); }
.sheet-body > * + * { margin-top: var(--s4); }
.sheet-sec { margin-top: var(--s7) !important; margin-bottom: calc(var(--s3) * -1); font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; }
.sheet-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); padding: var(--s2) 0 0; }
.sheet-hero .num { font-size: 64px; }
.sheet-hero .num .unit { font-size: 22px; }
.note { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); font-size: var(--fs-sm); line-height: 1.6; }
.note .i { margin-top: 2px; }
.note.warn { background: var(--warn-soft); color: color-mix(in srgb, var(--warn) 80%, var(--ink-1)); }
.note.sleep { background: var(--sleep-soft); color: color-mix(in srgb, var(--sleep) 75%, var(--ink-1)); }
.note.info { background: var(--fill-1); color: var(--ink-2); }
.smart-flag { font-weight: 600; }

/* =====================================================================
   12. DOCKER PAGE
   ===================================================================== */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s6); flex-wrap: wrap; margin-bottom: var(--s7); }
.page-title { margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -.035em; line-height: 1.1; }
.page-dek { margin: 10px 0 0; color: var(--ink-2); }
.page-dek b { color: var(--ink-1); font-weight: 600; font-variant-numeric: tabular-nums; }
.field { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: var(--r-pill); background: var(--card); box-shadow: var(--shadow-card); min-width: 240px; color: var(--ink-3); transition: box-shadow var(--dur-2); }
.field:focus-within { box-shadow: 0 0 0 2px var(--accent-ring), var(--shadow-card); }
.field input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink-1); min-width: 0; font-size: 14px; }
.field input::placeholder { color: var(--ink-3); }
.ctr-list { padding: 6px var(--s6); }
.ctr { display: grid; grid-template-columns: minmax(180px, 1.5fr) minmax(120px, 1fr) 150px 110px 110px 96px; gap: var(--s5); align-items: center; padding: 15px 0; border-top: 1px solid var(--line); cursor: pointer; transition: opacity var(--dur-2); }
.ctr:first-child { border-top: 0; }
.ctr-head { cursor: default; font-size: var(--fs-xs); color: var(--ink-3); padding: 14px 0 10px; }
.ctr-name { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ctr-name .t { min-width: 0; }
.ctr-name b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctr-name small { display: block; font: 11.5px var(--font-mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.sdot.off { background: var(--ink-3); box-shadow: 0 0 0 4px var(--fill-1); }
.sdot.busy { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.ports { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.port { font: 500 11.5px/22px var(--font-mono); padding: 0 8px; border-radius: 6px; background: var(--fill-1); color: var(--ink-2); white-space: nowrap; }
.port.hit { background: var(--accent-soft); color: var(--accent); }
.ctr-cpu { display: grid; grid-template-columns: 1fr 52px; gap: 10px; align-items: center; }
.ctr-cpu .spk { height: 24px; }
.ctr-cpu b, .ctr-mem b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.ctr-mem { font-variant-numeric: tabular-nums; }
.ctr-mem small, .ctr-up small { display: block; color: var(--ink-3); font-size: 11.5px; }
.ctr-up { font-size: var(--fs-sm); color: var(--ink-2); }
.ctr.off .ctr-cpu, .ctr.off .ctr-mem { opacity: .4; }
.acts { display: flex; justify-content: flex-end; gap: 2px; }
.act { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); transition: background var(--dur-1), color var(--dur-1); }
.act:hover { background: var(--fill-1); color: var(--ink-1); }
.act.danger:hover { background: var(--crit-soft); color: var(--crit); }
.act.go:hover { background: var(--ok-soft); color: var(--ok); }
.act[disabled] { opacity: .35; pointer-events: none; }
.act .i { width: 16px; height: 16px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--fill-3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.ctr.pending { cursor: progress; }
.pending-t { color: var(--accent); font-size: var(--fs-sm); font-weight: 500; }
.empty { display: grid; place-items: center; text-align: center; padding: var(--s9) var(--s6); color: var(--ink-2); gap: 10px; }
.empty svg.art { width: 120px; height: 84px; color: var(--ink-3); }
.empty b { color: var(--ink-1); font-size: 16px; font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: var(--r-pill); background: var(--fill-1); color: var(--ink-1); font-size: 14px; font-weight: 550; transition: background var(--dur-1), transform var(--dur-1), opacity var(--dur-1); white-space: nowrap; }
.btn:hover { background: var(--fill-2); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: #fff; }
[data-theme="dark"] .btn.primary { color: #12110F; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn.ghost { background: transparent; } .btn.ghost:hover { background: var(--fill-1); }
.btn.danger { color: var(--crit); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn .i { width: 16px; height: 16px; }
.port-col h4 { margin: 0 0 var(--s3); font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
.port-col h4 span { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 500; }
.lp-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.lp { display: inline-flex; flex-direction: column; padding: 8px 11px; border-radius: 10px; background: var(--card-sunk); box-shadow: inset 0 0 0 1px var(--line); min-width: 74px; transition: background var(--dur-2), box-shadow var(--dur-2), opacity var(--dur-2); }
.lp b { font: 600 14px/1.2 var(--font-mono); }
.lp small { font-size: 11px; color: var(--ink-3); }
.lp.hit { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-ring); }
.lp.dim, .row-i.dim { opacity: .3; }
.port-verdict { margin-top: var(--s3); font-size: var(--fs-sm); min-height: 1.6em; }
.app-card { padding: var(--s6); }
.app-card .app-top { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s5); }
.app-ico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; }
.app-ico .i { width: 24px; height: 24px; stroke-width: 1.7; }
.app-ico.photos { background: linear-gradient(160deg, #F2A65A, #E06B4E); }
.app-ico.video { background: linear-gradient(160deg, #5A7FE0, #3B55B8); }
.app-ico.music { background: linear-gradient(160deg, #E0638A, #B83F6A); }
.app-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); }
.app-stats .num { font-size: 24px; }
.app-card.off .app-stats { opacity: .45; }

/* =====================================================================
   13. SETTINGS
   ===================================================================== */
.settings { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: var(--s9); align-items: start; }
.set-nav { position: sticky; top: 96px; display: flex; flex-direction: column; gap: 2px; }

.set-nav a:hover { background: var(--fill-1); color: var(--ink-1); }
.set-nav a.on { background: var(--card); color: var(--ink-1); box-shadow: var(--shadow-card); }
.set-nav a .i { width: 16px; height: 16px; color: var(--ink-3); }
.set-nav a.on .i { color: var(--accent); }
.set-main { max-width: 760px; }
.set-group { scroll-margin-top: 96px; }
.set-group + .set-group { margin-top: var(--s9); }
.set-group > h3 { margin: 0 0 4px; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
.set-group > p { margin: 0 0 var(--s4); color: var(--ink-2); font-size: var(--fs-sm); }
.set-card { padding: 0 var(--s6); }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--s5); min-height: 62px; padding: 12px 0; border-top: 1px solid var(--line); }
.set-row:first-child { border-top: 0; }
.set-row .lbl { font-weight: 500; display: flex; align-items: center; gap: 6px; }
.set-row .hint { font-size: var(--fs-xs); color: var(--ink-3); margin-top: 1px; }
.set-row .ctl { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.set-row.block { grid-template-columns: 1fr; }
.set-row.block .ctl { justify-content: flex-start; }
.set-row.saved { animation: savedFlash 1.2s var(--ease); }
@keyframes savedFlash { 0% { background: transparent; } 20% { box-shadow: inset 3px 0 0 var(--accent); } 100% { box-shadow: inset 0 0 0 transparent; } }
.q { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--ink-3); transition: color var(--dur-1), background var(--dur-1); }
.q:hover, .q[aria-expanded="true"] { color: var(--accent); background: var(--accent-soft); }
.q .i { width: 14px; height: 14px; }
.switch { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--fill-3); transition: background var(--dur-2) var(--ease); flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.08); transition: transform var(--dur-2) var(--ease); }

.numfield .u { font-size: var(--fs-xs); color: var(--ink-2); margin: 0 8px 0 4px; white-space: nowrap; }

.numfield .st:hover { background: var(--card); color: var(--ink-1); }
.textfield { height: 36px; border-radius: 10px; background: var(--fill-1); border: 0; outline: 0; padding: 0 12px; width: 260px; transition: box-shadow var(--dur-2); }

.textfield.mono { font-family: var(--font-mono); font-size: 13px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 50%; background: var(--sw); position: relative; transition: transform var(--dur-2) var(--ease); }
.swatch:hover { transform: scale(1.08); }
.swatch[aria-checked="true"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; box-shadow: 0 0 0 2px var(--sw); }

.update-notes { grid-column: 1 / -1; margin: 0; padding: var(--s4) var(--s5); border-radius: var(--r-md); background: var(--card-sunk); box-shadow: inset 0 0 0 1px var(--line); font-size: var(--fs-sm); color: var(--ink-2); }

/* =====================================================================
   14. FLOATING: toast / popover / palette / shortcuts
   ===================================================================== */
.toasts { position: fixed; z-index: 90; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-radius: var(--r-pill); background: var(--ink-1); color: var(--ink-inv); font-size: 14px; font-weight: 500; box-shadow: 0 12px 32px -8px rgba(0,0,0,.35); pointer-events: auto; animation: toastIn var(--dur-3) var(--ease); white-space: nowrap; }
.toast .i { width: 16px; height: 16px; stroke-width: 2.2; }
.toast .i.ok { color: #7CD6A2; } [data-theme="dark"] .toast .i.ok { color: var(--ok); }
.toast button { height: 26px; padding: 0 10px; border-radius: var(--r-pill); background: rgba(255,255,255,.14); font-size: 13px; font-weight: 600; }

@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }

.popover { position: absolute; z-index: 80; width: 280px; padding: 14px 16px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow-pop); font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.65; animation: toastIn var(--dur-2) var(--ease); }

.palette-wrap { position: fixed; inset: 0; z-index: 85; display: none; justify-content: center; align-items: flex-start; padding-top: 14vh; background: var(--scrim); }
.palette-wrap.on { display: flex; animation: fadeIn var(--dur-2) var(--ease); }
@keyframes fadeIn { from { opacity: 0; } }
.palette { width: min(620px, calc(100vw - 24px)); background: var(--card); border-radius: 20px; box-shadow: var(--shadow-pop); overflow: hidden; animation: toastIn var(--dur-3) var(--ease); }
.palette-in { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 60px; border-bottom: 1px solid var(--line); color: var(--ink-3); }
.palette-in input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 18px; color: var(--ink-1); }
.palette-list { max-height: 50vh; overflow-y: auto; padding: 8px; }
.palette-g { font-size: 11.5px; color: var(--ink-3); padding: 10px 12px 4px; }
.palette-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 12px; text-align: left; font-size: 14px; }
.palette-item .i { color: var(--ink-3); }
.palette-item small { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.palette-item.on { background: var(--accent-soft); }

.palette-foot { display: flex; gap: 16px; padding: 10px 20px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.palette-foot span { display: inline-flex; gap: 6px; align-items: center; }
.keys { display: grid; grid-template-columns: 1fr auto; gap: 12px 24px; padding: 24px; font-size: 14px; }
.keys .kbd { min-width: 24px; height: 24px; font-size: 12px; }

/* =====================================================================
   15. EDIT LAYOUT MODE
   ===================================================================== */
.editbar { position: fixed; z-index: 45; left: 50%; bottom: 28px; transform: translate(-50%, calc(100% + 120px)); visibility: hidden; display: flex; align-items: center; gap: var(--s4); padding: 8px 8px 8px 20px; border-radius: var(--r-pill); background: var(--ink-1); color: var(--ink-inv); box-shadow: 0 16px 40px -10px rgba(0,0,0,.4); transition: transform var(--dur-3) var(--ease-sheet); font-size: 14px; white-space: nowrap; }

.editbar .btn { height: 34px; background: rgba(255,255,255,.12); color: inherit; }
[data-theme="dark"] .editbar .btn { background: rgba(0,0,0,.08); }

.editing .module.dragging { z-index: 10; }

.grip { width: 32px; height: 40px; display: grid; place-items: center; color: var(--ink-3); cursor: grab; touch-action: none; border-radius: 8px; flex: none; }
.grip:hover { color: var(--ink-1); background: var(--fill-1); }

/* =====================================================================
   16. MOBILE NAV + RESPONSIVE
   ===================================================================== */
.bottom-nav { display: none; }

/* =====================================================================
   17. REDUCED MOTION
   ===================================================================== */
@media (prefers-reduced-motion: reduce) {

  .fan-ico svg, .zzz span { animation: none !important; }
}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
.reduce-motion .fan-ico svg, .reduce-motion .zzz span { animation: none !important; }

/* skeleton */

/* ---- 界面风格切换器 ---- */
.style-sw { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--fill-1); margin-right: 6px; flex: none; }

<script>
(function () {
'use strict';

/* =====================================================================
   CORE UTILITIES
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ic = (n, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const setText = (el, s) => { if (el && el.textContent !== s) el.textContent = s; };
const setHTML = (el, s) => { if (el && el._html !== s) { el._html = s; el.innerHTML = s; } };
const setW = (el, pct) => { if (el) { const v = clamp(pct, 0, 100).toFixed(2) + '%'; if (el.style.width !== v) el.style.width = v; } };
const setCls = (el, base, extra) => { const c = extra ? base + ' ' + extra : base; if (el && el.getAttribute('class') !== c) el.setAttribute('class', c); };

/** 解析模板字符串为 DOM，收集 [data-ref] 到 el._r */
function mount(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  const el = t.content.firstElementChild;
  const r = {};
  if (el.dataset && el.dataset.ref) r[el.dataset.ref] = el;
  el.querySelectorAll('[data-ref]').forEach(n => { r[n.dataset.ref] = n; });
  el._r = r;
  return el;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem('fnm.b.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fnm.b.' + k, JSON.stringify(v)); } catch (e) {} },
};

const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');
const reduced = () => mqReduce.matches || (window.__S && window.__S.settings.motion === false);

/* =====================================================================
   FORMAT — 合理精度：百分比取整、速率自动单位、≥100 不带小数
   ===================================================================== */
const F = {
  int: v => (v == null || !isFinite(v)) ? '--' : String(Math.round(v)),
  d1: v => (v == null || !isFinite(v)) ? '--' : (Math.abs(v) >= 100 ? String(Math.round(v)) : v.toFixed(1)),
  d2: v => (v == null || !isFinite(v)) ? '--' : v.toFixed(2),
  /** 二进制字节 → [数值, 单位] */
  bytes(b) {
    if (b == null || !isFinite(b)) return ['--', ''];
    const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB']; let i = 0; let v = Math.abs(b);
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return [i === 0 ? String(Math.round(v)) : (v >= 100 ? String(Math.round(v)) : v.toFixed(1)), u[i]];
  },
  rate(b) { const p = F.bytes(b); return [p[0], p[1] + '/s']; },
  bytesStr(b) { const p = F.bytes(b); return p[0] + ' ' + p[1]; },
  rateStr(b) { const p = F.rate(b); return p[0] + ' ' + p[1]; },
  /** 硬盘容量用十进制（与厂商标称一致） */
  dsize(b) {
    if (b == null) return ['--', ''];
    const T = 1e12, G = 1e9;
    if (b >= T) { const v = b / T; return [v >= 10 || Number.isInteger(+v.toFixed(1)) ? (+v.toFixed(1)).toString() : v.toFixed(2), 'TB']; }
    return [String(Math.round(b / G)), 'GB'];

  dsizeStr(b) { const p = F.dsize(b); return p[0] + ' ' + p[1]; },
  dur(sec) {
    sec = Math.max(0, Math.floor(sec)); const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);

/* =====================================================================
   TWEEN — 单一 rAF 循环驱动所有数字过渡
   ===================================================================== */
const tween = (() => {
  const live = new Map(); let raf = 0;
  function frame(now) {
    raf = 0;
    live.forEach((t, el) => {
      const p = Math.min(1, (now - t.t0) / t.dur);
      const e = 1 - Math.pow(1 - p, 3);
      const v = t.from + (t.to - t.from) * e;
      el._tv = v; t.render(v);
      if (p >= 1) live.delete(el);
    });
    if (live.size) raf = requestAnimationFrame(frame);
  }
  return function (el, to, render, dur) {
    if (!el) return;
    if (to == null || !isFinite(to)) { live.delete(el); el._tv = undefined; render(null); return; }
    const from = el._tv;
    if (from == null || reduced() || document.hidden) { live.delete(el); el._tv = to; render(to); return; }
    if (from === to && !live.has(el)) return;
    live.set(el, { from, to, t0: performance.now(), dur: dur || 650, render });
    if (!raf) raf = requestAnimationFrame(frame);
  };
})();
/** 数字过渡：fmt(v) → string */
const num = (el, v, fmt = F.int) => tween(el, v, x => setText(el, x == null ? '--' : fmt(x)));

const numU = (el, uel, v, parts) => tween(el, v, x => { const p = x == null ? ['--', ''] : parts(x); setText(el, p[0]); setText(uel, p[1]); });

function makeGauge(icon) {

    <g transform="rotate(135 50 50)">

/** 单调三次插值，曲线平滑且不过冲 */
function monoPath(xs, ys) {
  const n = xs.length; if (!n) return '';
  const f = v => Math.round(v * 10) / 10;
  if (n === 1) return `M${f(xs[0])},${f(ys[0])}`;
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = xs[i + 1] - xs[i] || 1e-6; m[i] = (ys[i + 1] - ys[i]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : 3 * (dx[i - 1] + dx[i]) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
  let d = `M${f(xs[0])},${f(ys[0])}`;
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += `C${f(xs[i] + h)},${f(ys[i] + t[i] * h)} ${f(xs[i + 1] - h)},${f(ys[i + 1] - t[i + 1] * h)} ${f(xs[i + 1])},${f(ys[i + 1])}`; }
  return d;
}

function makeSpark(cls = 'spark') {
  const el = mount(`<svg class="${cls}" aria-hidden="true"><g data-ref="g"></g></svg>`);
  el._series = [];
  /** series: [{values, color?, area?}] ; opt: {min, max} */

  function draw() {

    const ser = el._series; if (!ser.length) return;
    let lo = opt().min, hi = opt().max;
    const all = ser.flatMap(s => s.values);
    if (lo == null) lo = Math.min(...all); if (hi == null) hi = Math.max(...all);
    if (hi - lo < 1e-9) { hi = lo + 1; }
    const pad = 3;
    let html = '';
    ser.forEach((s, si) => {
      const n = s.values.length; if (n < 2) return;
      const xs = s.values.map((_, i) => i / (n - 1) * w);
      const ys = s.values.map(v => pad + (1 - (clamp(v, lo, hi) - lo) / (hi - lo)) * (h - pad * 2));
      const d = monoPath(xs, ys);
      if (s.area !== false && si === 0) html += `<path class="area" d="${d}L${w},${h}L0,${h}Z"/>`;
      html += `<path class="line" d="${d}"${s.color ? ` style="stroke:${s.color}"` : ''}/>`;
      if (si === 0) html += `<circle cx="${w}" cy="${ys[n - 1].toFixed(1)}" r="2.5"/>`;

  }

/* =====================================================================
   LINE CHART — 手绘 SVG，十字线同步，悬浮提示
   ===================================================================== */
const Bus = {
  g: {},
  join(group, c) { (this.g[group] = this.g[group] || new Set()).add(c); },
  leave(group, c) { this.g[group] && this.g[group].delete(c); },
  emit(group, ts, src) { (this.g[group] || []).forEach(c => c.showAt(ts, c === src)); },

  const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;

class LineChart {

   * opt: { series:[{label,color,fmt:v=>[n,u]}], yMin, yMax, yTick:v=>str, group, legend:Element, peak:bool, height }

    this.host = host; this.opt = opt; this.ts = []; this.cols = []; this.hoverTs = null;
    host.classList.add('chart'); if (opt.height) host.style.height = opt.height + 'px';
    host.innerHTML = `<svg role="img"><g class="gg"></g><g class="gs"></g><g class="gp"></g><line class="xh" y1="0"/><g class="gd"></g><rect class="hit"/></svg><div class="tip"></div>`;
    this.svg = host.firstChild; this.tip = host.querySelector('.tip');
    [this.gGrid, this.gSer, this.gPeak, this.xh, this.gDots, this.hit] = [...this.svg.children];
    if (opt.group) Bus.join(opt.group, this);

      if (!this.ts.length) return;
      const r = this.svg.getBoundingClientRect();
      const x = clamp((e.clientX - r.left - this.L) / this.PW, 0, 1);
      const ts = this.ts[0] + x * (this.ts[this.ts.length - 1] - this.ts[0]);

    };

    this.hit.addEventListener('pointerdown', move);

  }

    this.opt.legend.innerHTML = this.opt.series.map((s, i) => `<span><span class="lk"><i style="background:${s.color}"></i>${esc(s.label)}</span><span class="lv" data-i="${i}">--<small></small></span></span>`).join('');
    this.lv = $$('.lv', this.opt.legend);
  }
  setData(ts, cols) { this.ts = ts; this.cols = cols; this.render(); }
  render() {

    const PW = this.PW = w - L - R, PH = this.PH = h - T - B;

    let g = '';
    for (let v = lo; v <= hi + step * 0.01; v += step) {

      if (o.yTick) g += `<text class="axis-t" x="${L - 8}" y="${y + 3.5}" text-anchor="end">${esc(o.yTick(v))}</text>`;

      const anchor = px > L + PW - 60 ? 'end' : px < L + 60 ? 'start' : 'middle';
      pk = `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" style="fill:${o.series[0].color};stroke:var(--card);stroke-width:2"/><text class="peak-t" x="${px.toFixed(1)}" y="${Math.max(10, py - 9).toFixed(1)}" text-anchor="${anchor}">${esc(lab)}</text>`;
    }
    this.gPeak.innerHTML = pk;
    this.xh.setAttribute('y1', T); this.xh.setAttribute('y2', T + PH);

      const span = this.ts[this.ts.length - 1] - this.ts[0];
      this.tip.innerHTML = `<div class="tt">${span > 86400 * 1.5 ? F.mdhm(this.ts[i]) : F.hm(this.ts[i])}</div>` +
        this.cols.map((c, k) => `<div class="tr"><span><i style="background:${o.series[k].color}"></i>${esc(o.series[k].label)}</span><b>${esc(joinU(o.series[k].fmt(c[i])))}</b></div>`).join('');
      const w = this.host._w || this.host.clientWidth, tw = this.tip.offsetWidth || 140;

/* =====================================================================
   BAR CHART — 堆叠柱，2px 间隔，逐柱悬浮
   ===================================================================== */
class BarChart {
  /** opt: { series:[{key,label,color}], fmt:v=>string, title:i=>string, xLabel:i=>string|null, height } */
  constructor(host, opt) {
    this.host = host; this.opt = opt; this.rows = [];
    host.classList.add('bars'); if (opt.height) host.style.height = opt.height + 'px';
    host.innerHTML = `<svg role="img"></svg><div class="tip"></div>`;
    this.svg = host.firstChild; this.tip = host.lastChild;
    this.svg.addEventListener('pointermove', e => {
      const r = e.target.closest('[data-i]'); if (!r) return this.hover(-1);
      this.hover(+r.dataset.i);
    });
    this.svg.addEventListener('pointerleave', () => this.hover(-1));
    observe(host, () => this.render());
  }
  setData(rows) { this.rows = rows; this.render(); }
  render() {
    const w = this.host._w || this.host.clientWidth, h = this.host._h || this.host.clientHeight;
    if (!w || !h || !this.rows.length) return;
    const o = this.opt, L = 0, T = 8, B = 22, PH = h - T - B, n = this.rows.length;
    const tot = this.rows.map(r => o.series.reduce((s, se) => s + r[se.key], 0));
    const max = Math.max(...tot) * 1.08;
    const slot = w / n, bw = Math.max(3, Math.min(22, slot - 3));
    let g = '';
    [0.5, 1].forEach(f => { const y = Math.round(T + PH * (1 - f / 1.08)) + .5; g += `<line class="grid-l" x1="0" x2="${w}" y1="${y}" y2="${y}" style="stroke:var(--line)"/>`; });
    this.rows.forEach((r, i) => {
      const x = L + slot * i + (slot - bw) / 2; let y = T + PH;
      g += `<g data-i="${i}"><rect x="${(slot * i).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${h}" fill="transparent"/>`;
      o.series.forEach((se, k) => {
        const hh = r[se.key] / max * PH; if (hh <= 0) return;
        const top = k === o.series.length - 1 || o.series.slice(k + 1).every(s2 => !r[s2.key]);
        const gap = k > 0 ? 2 : 0;
        y -= hh;
        g += `<rect class="b" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, hh - gap).toFixed(1)}" rx="${top ? Math.min(3, bw / 2) : 1}" style="fill:${se.color}${r.dim ? ';fill-opacity:.55' : ''}"/>`;
      });
      g += '</g>';
      const lab = o.xLabel && o.xLabel(i);
      if (lab) g += `<text class="axis-t" x="${(x + bw / 2).toFixed(1)}" y="${h - 4}" text-anchor="middle" style="fill:var(--ink-3);font-size:10.5px">${esc(lab)}</text>`;
    });

  }

    if (i === this._hi) return; this._hi = i;
    this.host.classList.toggle('hovering', i >= 0);
    $$('g[data-i]', this.svg).forEach(g => $$('rect.b', g).forEach(r => r.classList.toggle('on', +g.dataset.i === i)));
    if (i < 0) return this.tip.classList.remove('show');
    const o = this.opt, r = this.rows[i];
    this.tip.innerHTML = `<div class="tt">${esc(o.title(i))}</div>` + o.series.map(se => `<div class="tr"><span><i style="background:${se.color}"></i>${esc(se.label)}</span><b>${esc(o.fmt(r[se.key]))}</b></div>`).join('');
    const w = this.host._w, slot = w / this.rows.length, x = slot * (i + .5), tw = this.tip.offsetWidth || 140;
    this.tip.style.left = clamp(x - tw / 2, 0, w - tw) + 'px'; this.tip.style.top = '-8px'; this.tip.style.transform = 'translateY(-100%)';

  uiStyle: 'calm', theme: 'light', accent: 'ink', fontScale: 1, motion: true, syncUi: false,
  authOn: false, authSet: false, authDays: 7,
  dataDir: '/vol1/@appdata/fnmonitor', autoUpdate: false, updateDir: '',
};
const S = window.__S = {
  snap: FN.snap, ticks: 0, lastRender: 0,
  page: 'overview', sheet: null, editing: false,
  range: store.get('range', '24h'),
  settings: Object.assign({}, DEFAULTS, store.get('settings', {})),

/* 阈值 → 语义色（全局唯一来源） */
const LV = {
  cpu: v => v >= Math.min(98, S.settings.cpuWarn + 10) ? 'crit' : v >= S.settings.cpuWarn ? 'warn' : '',
  mem: v => v >= 92 ? 'crit' : v >= 80 ? 'warn' : '',
  temp: v => v >= S.settings.tempCrit ? 'crit' : v >= S.settings.tempWarn ? 'warn' : '',
  dtemp: v => v >= S.settings.diskTempWarn + 8 ? 'crit' : v >= S.settings.diskTempWarn ? 'warn' : '',
  cap: v => v >= 95 ? 'crit' : v >= S.settings.capWarn ? 'warn' : '',
};

/* 实时缓冲：近 2 分钟（60 个点） */
const BUF_N = 60;
const buf = {};
const JIT = { cpu: 7, mem: .25, temp: 1.2, power: 2.2, rx: .35, tx: .4 };
/** 确定性抖动：rel 为真时按比例，否则按绝对幅度 */
const jit = (v, i, seed, amp, rel) => { const n = Math.sin(i * 1.7 + seed) * .6 + Math.sin(i * .53 + seed * 3) * .4; return Math.max(0, rel ? v * (1 + n * amp) : v + n * amp); };
['cpu', 'mem', 'temp', 'power', 'rx', 'tx'].forEach((k, ki) => { buf[k] = FN.history(k, 120, BUF_N).map((p, i, a) => i === a.length - 1 ? p[1] : jit(p[1], i, ki, JIT[k], k === 'rx' || k === 'tx')); });
const ctrBuf = {}, diskBuf = {};
function push(a, v, n = BUF_N) { a.push(v); if (a.length > n) a.shift(); }
function feed(s) {
  push(buf.cpu, s.cpu.percent); push(buf.mem, s.mem.percent); push(buf.temp, s.temp.cpu); push(buf.power, s.power.total);
  push(buf.rx, s.net.reduce((a, n) => a + n.rx_rate, 0)); push(buf.tx, s.net.reduce((a, n) => a + n.tx_rate, 0));
  s.docker.containers.forEach(c => { const b = ctrBuf[c.name] || (ctrBuf[c.name] = { cpu: Array.from({ length: 30 }, (_, i) => jit(c.cpu, i, c.name.length, .45, true)), mem: new Array(30).fill(c.mem_bytes) }); push(b.cpu, c.cpu, 30); push(b.mem, c.mem_bytes, 30); });
  s.disks_detail.forEach(d => { const io = s.diskio.find(x => x.name === d.name); const b = diskBuf[d.name] || (diskBuf[d.name] = { r: Array.from({ length: BUF_N }, (_, i) => io ? jit(io.read_rate, i, 2, .5, true) : 0), w: Array.from({ length: BUF_N }, (_, i) => io ? jit(io.write_rate, i, 5, .5, true) : 0) }); push(b.r, io ? io.read_rate : 0); push(b.w, io ? io.write_rate : 0); });
  S.cpuHigh = s.cpu.percent > S.settings.cpuWarn ? S.cpuHigh + 1 : 0;
}

/* 历史：短范围做 1 分钟平滑，避免分钟级阶梯 */
const RANGE_OPTS = [['10m', '10分钟'], ['1h', '1小时'], ['6h', '6小时'], ['24h', '24小时'], ['7d', '7天'], ['30d', '30天']];
const RANGE_PTS = { '10m': 120, '1h': 180, '6h': 240, '24h': 288, '7d': 336, '30d': 360 };
const RANGE_TXT = { '10m': '过去 10 分钟', '1h': '过去 1 小时', '6h': '过去 6 小时', '24h': '过去 24 小时', '7d': '过去 7 天', '30d': '过去 30 天' };
function hist(metric, range) {
  const pts = RANGE_PTS[range], raw = FN.history(metric, range, pts);
  const stepS = FN.RANGES[range] / (pts - 1);
  const ts = raw.map(p => p[0]); let v = raw.map(p => p[1]);
  {
    const w = stepS < 60 ? Math.ceil(60 / stepS) : 1, last = v[v.length - 1], out = [];
    for (let i = 0; i < v.length; i++) { let s = 0, n = 0; for (let j = Math.max(0, i - w); j <= Math.min(v.length - 1, i + w); j++) { s += v[j]; n++; } out.push(s / n); }
    out[out.length - 1] = last; v = out;
  }
  return { ts, v };
}

/* 统计类数据（慢变化，定期刷新） */
const stats = { traffic: FN.traffic(), power: FN.powerStats(), monthly: FN.monthly(), ports: FN.ports(), apps: FN.apps(), weather: FN.weather(), lunar: FN.lunar() };
function refreshStats() { stats.traffic = FN.traffic(); stats.power = FN.powerStats(); stats.ports = FN.ports(); }

/* 格式器（给图表/图例用） */
const fPct = v => [F.int(v), '%'];
const fDeg = v => [F.int(v), '℃'];
const fW = v => [F.int(v), 'W'];
const fRpm = v => [F.int(v), 'RPM'];
const fMBs = v => [F.d1(v), 'MB/s'];
const shortBytes = v => { const p = F.bytes(v); return p[0] + p[1].charAt(0).replace('B', ''); };
const sumRx = s => s.net.reduce((a, n) => a + n.rx_rate, 0);
const sumTx = s => s.net.reduce((a, n) => a + n.tx_rate, 0);
const memParts = m => { const app = Math.max(0, m.used - m.cached - m.buffers); return { app, cache: m.cached, buf: m.buffers, free: Math.max(0, m.total - m.used) }; };
const gb = b => (b / GiB).toFixed(1);

/* =====================================================================
   HEALTH — 一句话结论 + 健康分
   ===================================================================== */
function computeHealth(s) {
  const h = FN.health();
  // CPU 高负载需"持续"（≥5 个采样，约 10 秒）才算问题，避免转码尖峰导致结论闪烁
  const issues = h.issues.filter(i => i.key !== 'cpu' || S.cpuHigh >= 5).map(i => {
    if (i.key.startsWith('disk:')) { const d = s.disks_detail.find(x => 'disk:' + x.name === i.key); return Object.assign({}, i, { text: `${d.name} 出现 ${d.reallocated_sectors} 个重映射扇区`, sheet: 'disk/' + d.name }); }
    if (i.key.startsWith('cap:')) return Object.assign({}, i, { sheet: 'disk/' + i.key.slice(4) });
    if (i.key === 'docker') return Object.assign({}, i, { go: 'docker?stopped' });
    if (i.key === 'cpu') return Object.assign({}, i, { sheet: 'cpu' });
    if (i.key === 'temp') return Object.assign({}, i, { sheet: 'temp' });
    return i;
  });
  const lt = LV.temp(s.temp.cpu);
  if (lt && !issues.some(i => i.key === 'temp')) issues.push({ level: lt, key: 'temp', text: `CPU 温度${lt === 'crit' ? '过高' : '偏高'}（${F.int(s.temp.cpu)}℃）`, sheet: 'temp' });
  const level = issues.some(i => i.level === 'crit') ? 'crit' : issues.some(i => i.level === 'warn') ? 'warn' : 'ok';
  const score = clamp(Math.round(100 - issues.reduce((a, i) => a + (i.level === 'crit' ? 22 : i.level === 'warn' ? 7 : 1), 0) - Math.max(0, s.temp.cpu - 70) * 0.4), 0, 100);
  return { level, issues, score };
}

const T_MIN = 20, T_MAX = 100, tPos = t => clamp((t - T_MIN) / (T_MAX - T_MIN) * 100, 0, 100);
function thermoRows(list) {
  return list.map(t => `<div class="thermo-row" data-t="${esc(t.k)}"><span class="${t.sleep ? 'faint' : ''}">${esc(t.label)}</span><div class="thermo"><span class="mk" style="left:${tPos(t.warn)}%"></span><span class="mk" style="left:${tPos(t.crit)}%"></span><i></i></div><span class="v"></span></div>`).join('');
}
function thermoList(s) {
  const st = S.settings, find = n => (s.sensors.temps.find(t => t.name === n) || {}).temp;
  return [
    { k: 'pkg', label: 'CPU 封装', v: s.temp.cpu, warn: st.tempWarn, crit: st.tempCrit, lv: LV.temp },
    { k: 'c0', label: '核心 0', v: find('Core 0'), warn: st.tempWarn, crit: st.tempCrit, lv: LV.temp },
    { k: 'c4', label: '核心 4', v: find('Core 4'), warn: st.tempWarn, crit: st.tempCrit, lv: LV.temp },
    { k: 'pch', label: 'PCH 芯片组', v: find('PCH'), warn: 80, crit: 95, lv: v => v >= 95 ? 'crit' : v >= 80 ? 'warn' : '' },
    { k: 'mb', label: '主板', v: s.temp.system, warn: 60, crit: 75, lv: v => v >= 75 ? 'crit' : v >= 60 ? 'warn' : '' },
  ].concat(s.disks_detail.map(d => ({ k: 'd-' + d.name, label: d.name + (d.standby ? ' · 休眠' : ''), v: d.temp, sleep: d.standby, warn: st.diskTempWarn, crit: st.diskTempWarn + 8, lv: LV.dtemp, disk: true })));
}
function updateThermo(root, list) {
  list.forEach(t => {
    const row = root.querySelector(`[data-t="${t.k}"]`); if (!row) return;
    const bar = row.querySelector('i'), v = row.querySelector('.v'), lv = t.sleep ? 'sleep' : t.lv(t.v);

  });
}

/* =====================================================================

   ===================================================================== */
const toasts = {};
function toast(msg, opt = {}) {
  const host = $('#toasts');
  if (opt.key && toasts[opt.key] && toasts[opt.key].isConnected) {
    const t = toasts[opt.key]; setText(t.querySelector('span'), msg); clearTimeout(t._tm); t._tm = setTimeout(() => dismiss(t), opt.ms || 2400); return t;
  }
  const t = mount(`<div class="toast" role="status">${ic(opt.icon || 'check', opt.icon && opt.icon !== 'check' ? '' : 'ok')}<span>${esc(msg)}</span>${opt.action ? `<button type="button">${esc(opt.action)}</button>` : ''}</div>`);
  if (opt.action) t.querySelector('button').onclick = () => { dismiss(t); opt.onAction && opt.onAction(); };
  host.append(t); if (opt.key) toasts[opt.key] = t;
  t._tm = setTimeout(() => dismiss(t), opt.ms || (opt.action ? 5000 : 2400));
  return t;
}
function dismiss(t) { if (!t.isConnected) return; t.classList.add('out'); setTimeout(() => t.remove(), 260); }

let pop = null;
function closePop() { if (pop) { pop.btn.setAttribute('aria-expanded', 'false'); pop.el.remove(); pop = null; } }
function openPop(btn, title, text) {
  if (pop && pop.btn === btn) return closePop();
  closePop();
  const el = mount(`<div class="popover" role="tooltip"><b>${esc(title)}</b>${esc(text)}</div>`);
  document.body.append(el);
  const r = btn.getBoundingClientRect(), w = 280;
  el.style.left = clamp(r.left + r.width / 2 - w / 2 + scrollX, 12 + scrollX, scrollX + innerWidth - w - 12) + 'px';
  el.style.top = (r.bottom + 10 + scrollY) + 'px';
  btn.setAttribute('aria-expanded', 'true');
  pop = { el, btn };
}
document.addEventListener('click', e => { if (pop && !pop.el.contains(e.target) && !pop.btn.contains(e.target)) closePop(); });

/** 抽屉内图表：一个范围切换控制该抽屉内全部图表，图表间十字线同步 */
function sheetCharts(ctx, body, defs, range = '24h') {
  const wrap = mount(`<div><div style="display:flex;justify-content:flex-end;margin:24px 0 10px" data-ref="seg"></div><div data-ref="list" style="display:grid;gap:12px"></div></div>`);

    wrap._r.list.append(card);
    const c = new LineChart(card._r.ch, { series: d.series, yMin: d.yMin, yMax: d.yMax, yTick: d.yTick, peak: d.peak, legend: card._r.leg, group: 'sheet', height: 180 });
    ctx.charts.push(c); return { d, c };
  });
  const load = r => charts.forEach(({ d, c }) => { const hs = d.series.map(se => hist(se.m, r)); c.setData(hs[0].ts, hs.map(h => h.v)); });
  wrap._r.seg.append(makeSeg(RANGE_OPTS, range, load, 'sm'));

}

function flip(els, mutate) {
  const first = new Map(els.map(e => [e, e.offsetTop]));
  mutate();
  els.forEach(e => {
    const dy = first.get(e) - e.offsetTop; if (!dy || reduced()) return;
    e.style.transition = 'none'; e.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { e.style.transition = 'transform 280ms var(--ease)'; e.style.transform = ''; }));
  });
}
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip'); if (!grip || !S.editing) return;
  const el = grip.closest('.module'), host = el.parentElement, page = host.dataset.layout;
  e.preventDefault(); grip.setPointerCapture(e.pointerId);
  const hostTop = () => host.getBoundingClientRect().top;
  const grabY = e.clientY - hostTop() - el.offsetTop;
  el.classList.add('dragging');
  const move = ev => {
    const y = ev.clientY - hostTop();
    const sibs = $$(':scope > .module', host).filter(c => c !== el);
    let before = null;
    for (const c of sibs) { if (y < c.offsetTop + c.offsetHeight / 2) { before = c; break; } }
    if (el.nextElementSibling !== before) flip(sibs, () => host.insertBefore(el, before));
    el.style.transition = 'none';
    el.style.transform = `translateY(${y - grabY - el.offsetTop}px)`;
    // 靠近视口边缘时自动滚动
    if (ev.clientY < 90) scrollBy(0, -12); else if (ev.clientY > innerHeight - 90) scrollBy(0, 12);
  };
  const up = () => {
    grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
    el.classList.remove('dragging'); el.style.transition = 'transform 240ms var(--ease)'; el.style.transform = '';
    setTimeout(() => { el.style.transition = ''; }, 260);
    saveLayout(page);
  };
  grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
});
