    this.items = it;
  },
  open() { this.build(); $('#palette').classList.add('on'); const i = $('#palInput'); i.value = ''; this.filter(''); setTimeout(() => i.focus(), 10); },
  close() { $('#palette').classList.remove('on'); },
  filter(q) {
    q = q.trim().toLowerCase();
    const sc = x => { const l = x.label.toLowerCase(); if (!q) return 1; if (l.startsWith(q)) return 3; if (l.includes(q)) return 2; if ((x.kw + ' ' + x.hint + ' ' + x.g).toLowerCase().includes(q)) return 1; return 0; };
    this.shown = this.items.map(x => [x, sc(x)]).filter(p => p[1] > 0).sort((a, b) => b[1] - a[1]).map(p => p[0]).slice(0, q ? 30 : 12);
    if (!q) this.shown = this.items.filter(x => x.g === '页面' || x.g === '详情' || x.g === '操作');
    this.sel = 0; this.draw();
  },
  draw() {
    const L = $('#palList');
    if (!this.shown.length) { L.innerHTML = `<div class="empty" style="padding:32px"><b>没有找到相关内容</b><span>试试 “sdc”、“jellyfin” 或 “电价”</span></div>`; return; }
    let g = '', html = '';
    this.shown.forEach((x, i) => { if (x.g !== g) { g = x.g; html += `<div class="palette-g">${g}</div>`; } html += `<button class="palette-item ${i === this.sel ? 'on' : ''}" type="button" data-i="${i}">${ic(x.icon)}<span>${esc(x.label)}</span><small>${esc(x.hint)}</small></button>`; });
    L.innerHTML = html;
    const on = L.querySelector('.on'); on && on.scrollIntoView({ block: 'nearest' });
  },
  run(i) { const x = this.shown[i]; if (!x) return; this.close(); x.run(); },
};
$('#palInput').addEventListener('input', e => Pal.filter(e.target.value));
$('#palInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); Pal.sel = clamp(Pal.sel + (e.key === 'ArrowDown' ? 1 : -1), 0, Pal.shown.length - 1); Pal.draw(); }
  if (e.key === 'Enter') { e.preventDefault(); Pal.run(Pal.sel); }
});
$('#palList').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) Pal.run(+b.dataset.i); });
$('#palette').addEventListener('click', e => { if (e.target.id === 'palette') Pal.close(); });
$('#btnSearch').onclick = () => Pal.open();

/* =====================================================================
   ROUTING  #/page[/sheet]
   ===================================================================== */
const PAGES = ['overview', 'docker', 'settings'];
function parseHash() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')), [p, ...rest] = h.split('/');
  return { page: PAGES.includes(p) ? p : 'overview', sheet: rest.join('/') || null };
}
function setHash(push) {
  const h = '#/' + S.page + (S.sheet ? '/' + S.sheet : '');
  if (location.hash === h) return;
  push ? history.pushState(null, '', h) : history.replaceState(null, '', h);
}
function showPage(p) {
  const changed = S.page !== p; S.page = p;
  PAGES.forEach(x => { const el = $('#page-' + x); el.hidden = x !== p; if (x === p && changed) { el.classList.remove('page-enter'); void el.offsetWidth; el.classList.add('page-enter'); } });
  $$('#pageSeg button, #bottomNav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.page === p)));
  placeThumb($('#pageSeg'));
  $('#btnEdit').style.visibility = p === 'settings' ? 'hidden' : '';
  if (p === 'settings' && S.editing) setEditing(false);
  if (changed) { scrollTo(0, 0); renderNow(); }
  document.title = (p === 'overview' ? '总览' : p === 'docker' ? '容器' : '设置') + ' · 飞牛监控';
}
function go(p) { if (S.sheet) closeSheet(true); showPage(p); setHash(false); }
function route() {
  const { page, sheet } = parseHash();
  showPage(page);
  if (sheet) openSheet(sheet, true); else closeSheet(true);
}
addEventListener('popstate', route);
addEventListener('hashchange', route);
$$('#pageSeg button, #bottomNav button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));

/* 全局点击：任何 [data-sheet] 打开对应抽屉 */
document.addEventListener('click', e => {
  if (S.editing) return;
  const t = e.target.closest('[data-sheet]'); if (!t || e.target.closest('[data-act]')) return;
  openSheet(t.dataset.sheet);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target; if (t.matches && t.matches('[data-sheet][role="button"]')) { e.preventDefault(); openSheet(t.dataset.sheet); }
});

/* =====================================================================
   KEYBOARD
   ===================================================================== */
function toggleTheme() { const dark = document.documentElement.dataset.theme === 'dark'; S.settings.theme = dark ? 'light' : 'dark'; store.set('settings', S.settings); applyTheme(); const seg = $('.set-row[data-k="theme"] .seg'); seg && seg.set(S.settings.theme); }
$('#btnTheme').onclick = toggleTheme;
$('#btnKeys').onclick = () => openSheet('keys');
document.addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
  if (e.key === 'Escape') {
    if (pop) return closePop();
    if ($('#palette').classList.contains('on')) return Pal.close();
    if (S.sheet) return closeSheet();
    if (S.editing) return setEditing(false);
    if (typing) e.target.blur();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#palette').classList.contains('on')) return;
  const k = e.key;
  if (k === '1' || k === '2' || k === '3') go(PAGES[+k - 1]);
  else if (k === '/') { e.preventDefault(); Pal.open(); }
  else if (k === 'e' || k === 'E') setEditing(!S.editing);
  else if (k === 't' || k === 'T') toggleTheme();
  else if (k === '?') openSheet('keys');
  else if ((k === 'r' || k === 'R') && S.page === 'overview') { const i = RANGE_OPTS.findIndex(o => o[0] === S.range), n = RANGE_OPTS[(i + 1) % RANGE_OPTS.length][0]; MODS.trends.seg.set(n); S.range = n; store.set('range', n); MODS.trends.load(); toast('趋势范围 · ' + RANGE_OPTS.find(o => o[0] === n)[1], { key: 'range', icon: 'trend' }); }
});

/* =====================================================================
   RENDER LOOP
   ===================================================================== */
function renderNow() {
  const s = S.snap; if (!s || document.hidden) return;
  if (S.page === 'overview') Hero.update(s);
  if (S.page !== 'settings') S.layout[S.page].order.forEach(id => { const m = MODS[id]; if (m && !m.el.classList.contains('off') && !m.el.hidden && m.update) m.update(s, m); });
  if (sheetCtx && sheetCtx.update) sheetCtx.update(s);
}
function beat() { const d = $('#liveDot'); d.classList.remove('beat', 'paused'); void d.offsetWidth; d.classList.add('beat'); }
document.addEventListener('visibilitychange', () => { $('#liveDot').classList.toggle('paused', document.hidden); if (!document.hidden) renderNow(); });
addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', scrollY > 4), { passive: true });
addEventListener('resize', () => placeThumb($('#pageSeg')));

/* =====================================================================
   BOOT
   ===================================================================== */
applyTheme();
['accent', 'fontScale', 'motion'].forEach(applySetting);
MODS.monthly.el.hidden = !S.settings.monthly;
setText($('#hostName'), S.snap.system.hostname);
Hero.build();
applyLayout('overview'); applyLayout('docker');
buildSettings();
feed(S.snap);
route();
setHash(false);
requestAnimationFrame(() => placeThumb($('#pageSeg')));
FN.onTick(s => {
  S.snap = s; feed(s); S.ticks++;
  const now = Date.now();
  if (now - S.lastRender < S.settings.interval * 1000 - 300) return;
  S.lastRender = now; beat(); renderNow();
});
})();
</script>
</body>
